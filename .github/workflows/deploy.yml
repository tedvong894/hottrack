name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          rm -rf .git .github
          ls -la

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # GitHub 偶发 API 竞态：artifact 上传成功后 deploy-pages 立即查询会 Found 0 artifact(s)
      # 等待元数据索引同步，避免部署误判失败
      - name: Wait for artifact index
        run: sleep 15

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
